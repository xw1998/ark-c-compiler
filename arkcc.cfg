# Ark C Compiler 默认运行时配置
# 优先级：命令行 > 配置文件 > 编译期默认（ARKCC_FEATURE_*）
# 布尔值接受：0/1/true/false（非零数字视为真）

[features]
# 前端语言特性
vla          = 1
complex      = 1
wchar        = 1
trigraph     = 1

# 后端代码生成
fpu_hw       = 1
dwarf        = 1

# 优化 Pass
opt_constfold = 1
opt_dce       = 1
opt_regalloc  = 0

[general]
# 优化级别：0=无, 1=基础, 2=激进
opt_level   = 0
# 调试信息：0=无, 1=DWARF
debug_info  = 0
