# Ark C Compiler default runtime configuration
# Priority: command line > config file > compile-time defaults (ARKCC_FEATURE_*)
# Booleans accept: 0/1/true/false (any non-zero number is true)

[features]
# Frontend language features
vla          = 1
complex      = 1
wchar        = 1
trigraph     = 1

# Backend code generation
fpu_hw       = 1
dwarf        = 1

# Optimization passes
opt_constfold = 1
opt_dce       = 1
opt_regalloc  = 0

# Lint passes (diagnostics only; the output is identical either way)
warn_mem      = 0
warn_enum     = 0
; warn_unused_result=1 时，被调用者声明了 warn_unused_result / __must_check
; 而调用值被整条语句丢弃（f();）就告警；(void)f(); 是显式丢弃，不告警
warn_unused_result = 0
# 0.8.6 MIR 检查（共用 ARKCC_FEATURE_MIR 开关；默认全关时产物逐字节不变）
# warn_unreachable   = 1   # 没有路径能到达的基本块
# warn_unused_static = 1   # 本文件里没人调用、地址也没外泄的 static 函数
# warn_recursion     = 1   # 本文件内部的调用环：递归没有栈上界
; Pass 管线剖面：full = 每个 pass 由自己的开关和 -O 级别决定（历史行为），
; lite = 只允许廉价阶段，其余阶段被跳过并留下理由（--print-pipeline 可读）
pipeline      = full

[general]
# Optimization level: 0=none, 1=basic, 2=aggressive
opt_level   = 0
# Debug info: 0=none, 1=DWARF
debug_info  = 0
