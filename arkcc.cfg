# Ark C Compiler default runtime configuration
# Priority: command line > config file > compile-time defaults (ARKCC_FEATURE_*)
# Booleans accept: 0/1/true/false (any non-zero number is true)

[features]
# Frontend language features
vla          = 1
complex      = 1
wchar        = 1
trigraph     = 1

# Backend code generation
fpu_hw       = 1
dwarf        = 1

# Optimization passes
opt_constfold = 1
opt_dce       = 1
opt_regalloc  = 0

[general]
# Optimization level: 0=none, 1=basic, 2=aggressive
opt_level   = 0
# Debug info: 0=none, 1=DWARF
debug_info  = 0
